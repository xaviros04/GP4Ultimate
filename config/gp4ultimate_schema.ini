; =====================================================================================
;  gp4ultimate_schema.ini - the options of gp4ultimate.ini, for gp4ultimate-config.exe
;
;  The configurator builds its pages from this file. A new version of the mod brings its
;  new schema and the configurator shows the new options without being rebuilt.
;  A repository test (test_schema) requires every option the DLLs read to be described
;  here, with the same default value as the code.
;
;  [section.key]          one option of gp4ultimate.ini
;    type    = bool | int | float | text | choice | hex
;    label   = visible name            help = explanation (tooltip)
;    page    = tab                     group = box inside the tab
;    default = default value           min / max / step = control range
;    choices = value: Text | value: Text        (for type = choice)
;    unit    = unit shown              advanced = 1  (only with "Show advanced")
;  Translations: label_es, help_es, choices_es (same values), unit_es; page and group
;  names are translated in [@lang.es]. Missing translations fall back to English.
;  [@section]  managed = controls     section edited by the Controls tab
;  Unknown types (from future versions) are shown as text.
; =====================================================================================

[schema]
version = 2

; ---- Sections edited by the Controls tab ---------------------------------------------
[@devices]
managed = controls
help = Alias for each physical controller (vidpid:VVVV:PPPP, name:text, guid:{...} or index:N).
help_es = Alias de cada mando físico (vidpid:VVVV:PPPP, name:texto, guid:{...} o index:N).

[@axes]
managed = controls
help = Axes of the virtual controller GP4 sees: X = steering, Y = throttle, RZ = brake, Z = clutch.
help_es = Ejes del mando virtual que ve GP4: X = dirección, Y = acelerador, RZ = freno, Z = embrague.

[@buttons]
managed = controls
help = Buttons 0-7 of the virtual controller (GP4 only reads those 8).
help_es = Botones 0-7 del mando virtual (GP4 solo lee esos 8).

[@povs]
managed = controls
help = Hat switches (POV) of the virtual controller.
help_es = Crucetas (POV) del mando virtual.

; ---- Controls ----------------------------------------------------------------------------
[virtual.ffb]
type = text
page = Controls
group = Force feedback
label = Force feedback controller
label_es = Mando con force feedback
help = Alias of the controller that receives the force (the wheel base). Chosen in the list above.
help_es = Alias del mando que recibe la fuerza (la base). Se elige en la lista de arriba.
default =
advanced = 1

[virtual.hide_physical]
type = bool
page = Controls
group = Virtual controller options
label = Hide the used controllers from GP4
label_es = Ocultar a GP4 los mandos usados
help = GP4 only sees the virtual controller, not the separate base/pedals (recommended).
help_es = GP4 solo ve el mando virtual, no la base/pedales sueltos (recomendado).
default = 1
advanced = 1

[virtual.hide_others]
type = bool
page = Controls
group = Virtual controller options
label = Hide the other controllers from GP4
label_es = Ocultar a GP4 el resto de mandos
help = GP4 opens every controller exclusively and only reads the first two: hiding the rest (vJoy, handbrake...) avoids conflicts.
help_es = GP4 abre todos los mandos en exclusiva y solo lee los dos primeros: ocultar los demás (vJoy, freno de mano...) evita conflictos.
default = 1
advanced = 1

[virtual.virtual_first]
type = bool
page = Controls
group = Virtual controller options
label = Virtual controller first
label_es = Mando virtual el primero
help = GP4 only gives force feedback to controller no. 0.
help_es = GP4 solo da force feedback al mando nº 0.
default = 1
advanced = 1

[virtual.devtype]
type = choice
page = Controls
group = Virtual controller options
label = Controller type GP4 sees
label_es = Tipo de mando que ve GP4
choices = driving: Wheel | joystick: Joystick | gamepad: Gamepad
choices_es = driving: Volante | joystick: Joystick | gamepad: Gamepad
default = driving
advanced = 1

[virtual.name]
type = text
page = Controls
group = Virtual controller options
label = Virtual controller name
label_es = Nombre del mando virtual
default = GP4 Composite Wheel
advanced = 1

[general.input]
type = bool
page = Controls
group = Virtual controller options
label = Enable the combined controller
label_es = Activar el mando combinado
help = Off: GP4 sees the controllers as they are (no input mod, no own force feedback).
help_es = Desactivado, GP4 ve los mandos tal cual (sin mod de entrada ni force feedback propio).
default = 1
advanced = 1


label_es = Carrera sin esperas (modo libre)
help = GP4 waits every step for the other players' packets, so with ping the race runs in slow motion (at 40 ms of ping, at 40 % speed). With this each PC runs at its own 60 fps and uses the latest data from the others. Everyone should have the mod.
help_es = GP4 espera en cada paso el paquete de los demás y con ping la carrera va a cámara lenta (a 40 ms de ping, al 40 % de velocidad). Con esto cada PC va a sus 60 fps y usa lo último que ha llegado de los demás. Conviene que todos lleven el mod.
default = 1

[net.playout]
type = bool
page = Online
group = Online races
label = Smooth the other players' cars
label_es = Suavizar los coches de los demás
help = Hands GP4 one packet per player per step and keeps one in reserve for the step when none arrives: other cars move without flicker. Adds at most one step (17 ms) of delay.
help_es = Entrega a GP4 un paquete de cada jugador por paso y guarda uno de reserva para el paso en que no llega ninguno: los coches de los demás avanzan sin parpadeos. Añade como mucho un paso (17 ms) de retraso.
default = 1
advanced = 1


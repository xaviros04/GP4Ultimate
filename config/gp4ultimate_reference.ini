; =====================================================================================
;  gp4ultimate_reference.ini  -  every GP4 Ultimate option, documented (reference only).
;  Your own settings go in gp4ultimate.ini (gp4ultimate-config.exe creates it); copy from
;  here only the lines you need. The [devices]/[axes] below are an EXAMPLE.
;  gp4ultimate.ini lives next to GP4.exe, beside dinput8.dll and d3d8.dll. Changes apply
;  when GP4 restarts.
;  The easy way is gp4ultimate-config.exe; this file documents every option by hand.
;  `gp4ultimate-devices ini` proposes [devices]/[axes]/[buttons] for YOUR controllers, and
;  `gp4ultimate-devices watch` shows which axis is each pedal.
; =====================================================================================

[general]
input = 1              ; 0 = leave input alone (the DLL only forwards to DirectInput)
log = 1                ; writes gp4ultimate.log next to the game (very useful at first)
; language = auto      ; configurator language: auto (Windows' language) | en | es
; chain = gp4hook.dll  ; chain another dinput8 proxy (renamed)
; crash_report = 1      ; on a crash, gp4ultimate_crash.txt + .dmp say where it happened
; fix_sound_crash = 1   ; GP4's sound timer vs freed sounds race (crash in long online races)

; -------------------------------------------------------------------------------------
; Physical controllers. alias = selector
;   vidpid:VVVV:PPPP     by vendor/product (hex), the most stable
;   name:"text"          by part of the name (case-insensitive)
;   guid:{...}           one specific instance (for two identical devices)
;   index:N              N-th attached controller (fragile, last resort)
; -------------------------------------------------------------------------------------
[devices]
wheel   = name:"wheel"        ; EXAMPLE - replace with what `gp4ultimate-devices ini` says
pedals  = name:"pedals"
; shifter = name:"shifter"

; -------------------------------------------------------------------------------------
; The virtual controller GP4 will see (pick it in the game's controls menu).
; -------------------------------------------------------------------------------------
[virtual]
name = GP4 Composite Wheel
ffb = wheel              ; alias that receives force feedback (empty = no FFB)
hide_physical = 1        ; hide the real devices used here from the game. NEEDED in GP4:
                         ;   it opens EVERY controller exclusively and only takes 4
virtual_first = 1        ; virtual controller first: GP4 only gives force feedback to no. 0
hide_others = 1          ; also hide the controllers not in [devices] (vJoy, handbrake...):
                         ;   GP4 would open them exclusively without using them
devtype = driving        ; driving | joystick | gamepad

; -------------------------------------------------------------------------------------
; Virtual controller axes = alias.AXIS [options]
;   axes: X Y Z RX RY RZ S0 S1
;   options: invert  deadzone=0.03  gamma=1.5  min=0.02 max=0.95  center
;     - min/max: calibration (fraction of the physical travel that counts as 0% and 100%)
;     - gamma > 1: softer at the start of the travel (useful on a load-cell brake)
;     - X (steering) is centred by default; the rest go from 0 to 100%
;   Pedals combined on one axis (for old setups):
;     Y = combine(pedals.Y invert, pedals.RZ invert)   ; throttle up, brake down
; -------------------------------------------------------------------------------------
[axes]
X  = wheel.X
Y  = pedals.Y invert          ; throttle
RZ = pedals.RZ invert         ; brake
Z  = pedals.Z invert          ; clutch

; -------------------------------------------------------------------------------------
; Buttons: "auto" chains the buttons of those devices in order (0, 1, 2, ...).
; Explicit entries  N = alias.bM  win over auto.
; -------------------------------------------------------------------------------------
[buttons]
auto = wheel
; 40 = shifter.b0   ; gear 1 of an H shifter
; 41 = shifter.b1

[povs]
0 = wheel.pov0

; -------------------------------------------------------------------------------------
; Force feedback
;   mode = telemetry  own engine driven by the car's state (default)
;          game       GP4's original FFB, forwarded to the wheel
;          mix        both at once
;          off        no forces
; -------------------------------------------------------------------------------------
[ffb]
mode = telemetry
rate_hz = 500
master_gain = 0.55
invert = 0                 ; check it with `gp4ultimate-devices ffb <n>`
max_output = 1.0
background = 0             ; 1 = keep FFB when the window loses focus
game_effects_gain = 1.0    ; gain of the game's effects in game/mix modes

; GP4's own force signal (verified in GP4.exe's code):
;   GP4 computes in the car +0x5E = (aligning torque + steering damping) x the menu's
;   FFB strength (%) and sends it as -1.5 x value / 10000. These defaults reproduce the
;   original force exactly; the mod adds the 500 Hz delivery.
game_signal = total        ; total = what GP4 would send | aligning = aligning torque only
                           ;   (without GP4's damping; raise damping if you use it, e.g. 0.06)
game_gain = 1.0
game_scale = 0.00015       ; 1.5/10000, GP4's scale
game_invert = 1            ; GP4 flips the sign before sending
game_lowpass_hz = 30       ; smooths the simulation's steps at 500 Hz

; Own aligning-torque model: follows your wheel at 500 Hz (20-40 ms ahead of GP4).
; Calibrated with a real race: correlation 0.96 with GP4's term.
model_mix = 0              ; share of GP4's aligning torque replaced by the model (0..1)
model_scale = 1.3          ; GP4's term / model (calibrated)
model_gain = 0             ; model added on top of everything (testing)
steer_lock_deg = 12        ; front wheel angle at full steering lock
alpha_peak_deg = 6         ; tyre slip angle at peak grip
aero_load = 0.0003
cg_to_front_m = 1.6
yaw_units_per_turn = 4294967296
heading_units_per_turn = 65536

; Wheel feel
wheel_range_deg = 360      ; lock-to-lock degrees of YOUR wheel
; Damping (against the centre ping-pong on straights: GP4 updates its force at ~29 Hz and
; at high speed reaches full force with ~10 degrees of lock). By default the general
; damping is left to your wheel base software and the mod only adds damping_speed, which
; grows with speed and holds the centre on straights (the base cannot: it does not know
; the car's speed). Without damping in the base, try damping 0.03, damping_low_speed 0.04.
damping = 0                ; always (0: your wheel base does it)
damping_speed = 0.15       ; extra, ramps in linearly up to 180 km/h (0.2 if it still oscillates)
damping_adapt = 1          ; scales the above to GP4's fps (less at 60, more at 30)
damping_low_speed = 0      ; extra in the pits / very slow
friction = 0.01
no_car_centering = 0.15    ; soft spring in menus or while looking for the car
min_force = 0.0            ; compensates the dead zone of belt/gear motors
slew_per_s = 40

; Surface and grip (from GP4's per-wheel record; idea from the GP2FFB mod)
kerb_gain = 0.2            ; vibration on kerbs (frequency follows speed)
gravel_gain = 0.1          ; roughness on gravel
grass_gain = 0.04          ; roughness on grass
offroad_light = 0.3        ; lighter steering with the front wheels off the tarmac
scrub_gain = 0.1           ; fine vibration when the front tyres slide (understeer)
scrub_full = 8192          ; slip at which the scrub is strongest
; Braking (front wheel forces, physics hook in GP4)
brake_gain = 0.15          ; pull when one front wheel brakes harder than the other
brake_full = 100000        ; force difference for the full effect (lbf x 256)
lockup_gain = 0.1          ; vibration when a front wheel locks
lockup_full = 8192         ; longitudinal slip for the full vibration
; Effects
shift_kick = 0.12
shift_ms = 50
impact_gain = 0.35
impact_g = 2.5
road_gain = 3              ; bumps from the front suspension (0 = none)
road_scale = 0.00006103515625 ; 1/16384, calibrated on a real lap
road_hp_hz = 6
front_left = 2             ; indices 2 and 3 = front wheels (verified in GP4.exe)
front_right = 3

; Tuning log: gp4ultimate_ffb.csv with telemetry and every force component
log_csv = 0
log_every = 5

; -------------------------------------------------------------------------------------
; Telemetry: where the player's car is in memory
;   By default GP4's own pointer to the player's car (0x66D820, verified in GP4.exe).
;   With car_pointer = 0 it searches memory for the car table and confirms which car is
;   yours by correlating its steering with your wheel (useful with another executable).
; -------------------------------------------------------------------------------------
[telemetry]
car_pointer = 0x0066D820     ; GP4's pointer to the player's car
wheel_record = 0x00625ABC    ; per-car record: surface and slip of each wheel
physics_hook = 1             ; per-wheel forces of the player's car (braking feel)
; car_address = 0x0066FEF0   ; or a fixed address (GP4's table starts here, 22 cars)
respect_game_pause = 1       ; no force when GP4 sends none either (pause, menus...)
scan_heap = 1
min_run = 6
require_confirm = 0          ; 1 = no forces until confirmed with the wheel
confirm_threshold = 0.8      ; minimum wheel <-> car steering correlation to confirm

; -------------------------------------------------------------------------------------
; Cockpit and display (this mod's d3d8.dll)
; -------------------------------------------------------------------------------------
[cockpit]
; Cockpit steering wheel: GP4 turns it at most 157 degrees, following the steering lock.
; With a value it turns like your wheel (lock-to-lock degrees; default 360). 0 = original.
; Depends on the wheel calibration in GP4's controls menu: turn fully both ways when
; calibrating.
wheel_rotation_deg = 360

[display]
log = 1                    ; gp4ultimate_d3d.log: resolution, adapter and projection aspect
aspect_fix = 0             ; 1 = Hor+ correction if the image looks stretched (the log says so)
aspect = auto              ; auto = the back buffer's; or e.g. 48:9 or 5760:1080 (aspect_fix only)
fov_scale = 1.0            ; >1 widens the field of view
capture_key = 0x7A         ; F11: captures the D3D8 calls of the next frames
capture_frames = 2
; chain = d3d8to9.dll      ; chain another d3d8 (d3d8to9, dgVoodoo2...), renamed
; resolution = auto        ; WxH (e.g. 2560x1080) or auto = the desktop's; replaces the
                           ;   "1600x1200" entry of GP4's graphics menu
window = 0                 ; 1 = borderless window the size of GP4's resolution, centred
                           ;     on the monitor (with Surround/Eyefinity: the centre screen)
window_x = auto            ; auto = centred; or the desktop position in pixels
window_y = auto

; -------------------------------------------------------------------------------------
; Online (GP4's network multiplayer)
; -------------------------------------------------------------------------------------
[net]
; server =                 ; GP4 Ultimate server (name or IP[:port]) instead of DirectPlay:
                           ;   no VPN, no DirectPlay feature, no open port on the players' PCs.
                           ;   "local" runs it inside this GP4 (the others use your public IP)
; server_port = 24004      ; UDP port of the server when server = local
; room =                   ; on a shared server, only games of the same room are listed
; race_director = auto     ; who runs the race clock and AI: auto (through a server: the best
                           ;   connection to it; DirectPlay: GP4 = fastest PC), gp4, prefer, avoid
log = 1                    ; network summary in gp4ultimate.log ("net:" and "netsync" lines)
freerun = 1                ; race without waiting: every PC at its own fps (original GP4:
                           ;   slow motion with ping). Best if everyone has the mod
; playout = 1              ; smooths the other players' cars (one packet per step)
; predict = 0              ; experimental: late remote cars carried on by GP4's physics
; predict_max_steps = 30   ;   for at most this many steps in a row
; drop_silent_after_s = 10 ; a player silent this long (crashed) is taken out of the race; 0 = never
; sync_window_ms = 30      ; race clock margin with the PC running the race
; max_wait_ms = 50         ; longest wait per step when this PC is ahead
; max_catchup = 3          ; extra steps in a row when it is behind
